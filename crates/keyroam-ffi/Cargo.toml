[package]
name = "keyroam-ffi"
description = "C ABI over the KeyRoam engine for the Flutter apps (JSON request/response)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keyroam-core = { path = "../keyroam-core" }
keyroam-sync = { path = "../keyroam-sync" }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
keyroam-sync = { path = "../keyroam-sync", features = ["test-util"] }
tempfile.workspace = true
