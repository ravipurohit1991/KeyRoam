name: Build apps

# Builds every KeyRoam app and uploads them as workflow artifacts.
# Pushing a tag like `v0.2.0` also publishes them as a GitHub Release.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   KEYROAM_GOOGLE_CLIENT_ID / KEYROAM_GOOGLE_CLIENT_SECRET
#     Google OAuth "Desktop app" client, embedded into the Windows/macOS apps
#     and the CLI so Google sign-in works out of the box.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  KEYROAM_GOOGLE_CLIENT_ID: ${{ secrets.KEYROAM_GOOGLE_CLIENT_ID }}
  KEYROAM_GOOGLE_CLIENT_SECRET: ${{ secrets.KEYROAM_GOOGLE_CLIENT_SECRET }}

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Embed Google OAuth client
        if: env.KEYROAM_GOOGLE_CLIENT_ID != ''
        shell: bash
        run: .github/scripts/embed-oauth-client.sh
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Bundle the browser native-messaging host
        shell: bash
        run: |
          cargo build --release --locked -p keyroam-native-host
          cp target/release/keyroam-native-host.exe app/build/windows/x64/runner/Release/
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath KeyRoam-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KeyRoam-windows-x64
          path: KeyRoam-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Embed Google OAuth client
        if: env.KEYROAM_GOOGLE_CLIENT_ID != ''
        run: .github/scripts/embed-oauth-client.sh
      - name: Build
        working-directory: app
        run: flutter build macos --release
      - name: Bundle the browser native-messaging host
        run: |
          APP=app/build/macos/Build/Products/Release/KeyRoam.app
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p keyroam-native-host --target "$t"
          done
          lipo -create -output "$APP/Contents/MacOS/keyroam-native-host"             target/aarch64-apple-darwin/release/keyroam-native-host             target/x86_64-apple-darwin/release/keyroam-native-host
          # Ad-hoc signatures (the app is not notarised yet). The host runs
          # outside the sandbox, so it is signed without the app's entitlements.
          codesign --force --sign - "$APP/Contents/MacOS/keyroam-native-host"
          codesign --force --sign - --entitlements app/macos/Runner/Release.entitlements "$APP"
          codesign --verify --strict "$APP"
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release/KeyRoam.app KeyRoam-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KeyRoam-macos-universal
          path: KeyRoam-macos-universal.zip
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK and App Bundle
        working-directory: app
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Collect
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk KeyRoam-android.apk
          cp app/build/app/outputs/bundle/release/app-release.aab KeyRoam-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: KeyRoam-android
          path: |
            KeyRoam-android.apk
            KeyRoam-android.aab
          if-no-files-found: error

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build ios --release --no-codesign
      - name: Package
        run: |
          mkdir Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/
          zip -qry KeyRoam-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KeyRoam-ios-unsigned
          path: KeyRoam-ios-unsigned.ipa
          if-no-files-found: error

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and build
        working-directory: browser-extension
        run: |
          npm test
          npm run build
      - name: Package
        run: |
          (cd browser-extension/dist/chromium && zip -qr "$GITHUB_WORKSPACE/KeyRoam-extension-chromium.zip" .)
          (cd browser-extension/dist/firefox && zip -qr "$GITHUB_WORKSPACE/KeyRoam-extension-firefox.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: KeyRoam-extension
          path: |
            KeyRoam-extension-chromium.zip
            KeyRoam-extension-firefox.zip
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            bin: keyroam
          - os: windows-latest
            name: windows-x64
            bin: keyroam.exe
          - os: macos-latest
            name: macos-arm64
            bin: keyroam
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p keyroam-cli
      - uses: actions/upload-artifact@v4
        with:
          name: keyroam-cli-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android, ios, extension, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files
        run: |
          mkdir release
          # Apps: each artifact folder already holds its final file(s).
          cp dist/KeyRoam-*/* release/
          # CLI: Windows as .exe, Linux/macOS as .tar.gz (keeps the executable bit).
          for d in dist/keyroam-cli-*; do
            platform=${d#dist/keyroam-cli-}
            if [ -f "$d/keyroam.exe" ]; then
              cp "$d/keyroam.exe" "release/keyroam-cli-$platform.exe"
            else
              chmod +x "$d/keyroam"
              tar -czf "release/keyroam-cli-$platform.tar.gz" -C "$d" keyroam
            fi
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Pre-release build. **Use only synthetic passwords** until KeyRoam has passed its security review.
            The macOS and iOS builds are not signed or notarised; the Android build is signed with a debug key.
            Browser autofill: install `KeyRoam-extension-chromium.zip` (Chrome, Edge, Brave) or `KeyRoam-extension-firefox.zip`, then in the desktop app open the menu → Browser autofill… → Set up browsers. See browser-extension/README.md.
          files: release/*
